name: Accelerate Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Shell contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The governed-drift contract binds sources to an immutable ancestor.
          # Keep that ancestry available to the canonical suite.
          fetch-depth: 0

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Python test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/accelerate-ci-venv"
          "$RUNNER_TEMP/accelerate-ci-venv/bin/python" -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Run canonical test suite
        run: PATH="$RUNNER_TEMP/accelerate-ci-venv/bin:$PATH" bash tests/all.sh
