name: Accelerate Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Shell contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The governed-drift contract binds sources to an immutable ancestor.
          # Keep that ancestry available to the canonical suite.
          fetch-depth: 0

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run canonical test suite
        run: bash tests/all.sh
