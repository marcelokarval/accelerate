schema_version = 1
authority = "accelerate-repo"
parity_kind = "capability-directional"

codex_roles = [
  "orchestrator", "python-backend", "nextjs-frontend", "research",
  "reviewer", "qa", "data-db", "integrations-ops", "mechanical-fixer",
  "test-engineer", "high-stakes-reviewer",
]

openhands_agent_profiles = [
  "default", "orchestrator", "python-backend", "nextjs-frontend", "research",
  "reviewer", "qa", "data-db", "integrations-ops", "mechanical-fixer",
  "test-engineer", "high-stakes-reviewer", "gemini-flash",
  "codex",
]

openhands_native_subagent_roles = [
  "python-backend", "nextjs-frontend", "data-db",
  "integrations-ops", "qa", "test-engineer", "research",
  "mechanical-fixer", "reviewer", "high-stakes-reviewer",
]

[hermes]
materialization = "selective"
profiles = [
  "default", "brain-agent", "coding-agent", "curator-agent", "deepseek",
  "design-agent", "log-analyst", "ops-agent", "orchestrator", "qa-agent",
  "research-agent", "session-agent", "sync-agent", "yasmim",
]
retired_profiles = ["sdr-agent"]

[openhands_acp.codex]
server = "codex"
model = "gpt-5.6-terra"
credential_source = "codex-cli-login"
secret_copying = false

[openhands_acp.gemini-flash]
server = "gemini-cli"
model = "gemini-3.7-flash"
credential_source = "gemini-cli-or-runtime-env"
secret_copying = false

[openhands_native_bindings]
default = "chatgpt-sol-medium"

[openhands_native_task]
contract = "openhands-native-taskmanager-v1"
runtime_package = "openhands-agent-server"
runtime_package_version = "1.42.1"
runtime_version_readback = "explicit"
runtime_semantics_evidence = "session-tool-readback-required"
enforcement = "prompt-contract-only"
root_subscription_state = "supported"
child_subscription_state = "unsupported"
child_binding_state = "binding_unavailable"
binding_unavailable_reason = "No supported non-subscription child binding is proven in this manifest. Agent Canvas can inject a child-conversation launcher outside Agent Profile controls, so binding_unavailable is not native enforcement."
dispatch_after = "TASKS_READY"
on_required_dispatch_failure = "blocked"
allowed_root_local_degradation = [
  "explicit_user_opt_out",
  "collaboration_unavailable",
  "spawn_failed_operator_authorized",
]
max_parallel_policy_cap = 3
child_depth = 1
child_task_tool = false
requested_effective_receipt = true

[openhands_subagent_registry]
materialization = "user-file-agents"
target = "~/.agents/agents"
root_profiles = ["default"]
excluded_profiles = ["codex", "gemini-flash"]
max_parallel_recommendation = 3
recursive_delegation = false

[openhands_root_delegation_policy]
profiles = ["default"]
max_parallel_recommendation = 3
system_message_suffix = """
You are the canonical OpenHands chat parent. For engineering work, use the available Accelerate skill as the entry workflow. Complete hardening, repository bootstrap, specification, and the TASKS_READY gate before dispatching any task. After TASKS_READY, when two or more bounded slices are independent, you MUST use the native task tool before task-owned mutation. Use at most three concurrent native children, selecting only a role with an available binding. Give each child an exact objective, allowed scope, non-goals, expected evidence, requested model and effort, and require its effective model and effort receipt when the runtime exposes them. Keep simple, tightly coupled, integration, and closure work in the parent. Never delegate root authority, external writes, review-of-review, or final closure. Children are one level only and have no task tool: do not ask them to spawn. Wait for every required result, reconcile conflicts and model/tool failures, independently verify material claims, and produce the final integrated answer. If required dispatch has no available binding or fails, stop with binding_unavailable or blocked. Do not silently perform delegated work in the root. Root-local degradation is allowed only with explicit_user_opt_out, collaboration_unavailable, or spawn_failed_operator_authorized, and the receipt must name that reason. ACP launch profiles are not native children.

Treat every child result as evidence, never as truth. The final review and consolidation must actively try to disprove the proposed solution: look for missing acceptance criteria, unsupported claims, contradictory evidence, untested failure paths, regressions, security or operational risks, and work that only appears complete because a tool or child reported success. Require direct evidence for material claims, distinguish confirmed facts from inference and recommendation, and keep the work blocked when a high-impact uncertainty remains. Do not declare closure merely because implementation or tests passed. Before the final answer, reconcile each child result, record rejected findings with reasons, and state residual risks and the next proof required.
"""

[openhands_skill_registry]
materialization = "user-file-skills"
target = "~/.agents/skills"
source_root = "global-runtime"
skills = ["accelerate"]

# These are LLM profiles, not personas. They are materialized under the
# OpenHands profile store and are then selected by the native Agent Profiles
# above. Subscription profiles deliberately contain no copied credential.
[openhands_llm_profile_registry]
materialization = "managed-llm-profile-json"
target = "~/.openhands/profiles"

[[openhands_llm_profile_registry.profiles]]
name = "chatgpt-sol-medium"
model = "gpt-5.6-sol"
auth_type = "subscription"
subscription_vendor = "openai"
is_subscription = true
reasoning_effort = "medium"
api_mode = "responses"

