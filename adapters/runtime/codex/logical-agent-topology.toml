schema_version = 1
topology_identity = "codex-logical-agent-topology"
authority = "logical routing contract; Codex profiles are additive and do not enforce process, tool, MCP, credential, or filesystem isolation"
spawn_packet_limit = 10
root_exclusive_authority = ["issue topology", "external writes", "integration", "review-of-review", "closure"]
assignment_contract = "assignment-only; logical profiles do not enforce process, tool, MCP, credential, or filesystem isolation"
assignment_ontology = "static orthogonal vocabulary; Tester=verifier+verification, QA is proof-lane discipline, adversarial verification is verification_mode and adversarial review is review_mode"
specialization_dimensions = ["surface", "domain_path"]
physical_profile_policy = "small fixed logical profiles; specialize assignments by surface and domain_path rather than creating profiles"
default_fork_turns = "none"
fork_turns_override = "integer-1-to-5-only"
forbid_fork_turns_all_with_override = true
luna_delegation = "leaf-only"
nested_terra_luna_exception = "root-authorized-only; one-luna; prescribed-mechanical-scope; global-budget-exactly-3; disjoint-scopes; terra-accountability; independent-reviewer"

[[agents]]
name = "orchestrator"
kind = "root-orchestrator"
role_family = "root"
catalog_group = "root-core"
model = "gpt-5.6-sol"
reasoning_effort = "medium"
review_posture = "adversarial-consolidation"
write_mode = "root-only"
external_writes = true
closure_authority = true
required_skills = ["accelerate", "prompt-hardening", "plane", "subagent-governance", "skill-catalog-router", "verification-before-completion"]

[[agents]]
name = "python-backend"
kind = "specialist"
role_family = "backend"
